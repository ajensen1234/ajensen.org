<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Pre-paint theme application (R9): runs before first paint so pages never
			// flash the wrong theme. Default derives from prefers-color-scheme; the saved
			// choice wins. Pages remain readable with JS disabled (default theme renders).
			try {
				const stored = localStorage.getItem('theme');
				const theme =
					stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
			} catch {
				// localStorage unavailable (private mode etc.) — keep the default theme.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-base-100 text-base-content">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
